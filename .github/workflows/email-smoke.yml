name: Test report email
on:
  workflow_dispatch:
    inputs:
      connection_only:
        description: Check encrypted SMTP without signing in or sending mail
        type: boolean
        default: true
      include_model_note:
        description: Include the configured one-time PDF in the test email
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rosstat-email-smoke
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the Gmail connection
        run: python email_smoke.py --connection-only
      - name: Install report dependencies
        if: ${{ !inputs.connection_only }}
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Send test to the designated test inbox
        if: ${{ !inputs.connection_only }}
        env:
          REPORT_EMAIL_SMTP: ${{ secrets.REPORT_EMAIL_SMTP }}
          REPORT_EMAIL_MODEL_NOTE_JOB: ${{ inputs.include_model_note && secrets.REPORT_EMAIL_MODEL_NOTE_JOB || '' }}
          REPORT_EMAIL_MODEL_NOTE_1: ${{ inputs.include_model_note && secrets.REPORT_EMAIL_MODEL_NOTE_1 || '' }}
          REPORT_EMAIL_MODEL_NOTE_2: ${{ inputs.include_model_note && secrets.REPORT_EMAIL_MODEL_NOTE_2 || '' }}
          REPORT_EMAIL_MODEL_NOTE_3: ${{ inputs.include_model_note && secrets.REPORT_EMAIL_MODEL_NOTE_3 || '' }}
          INFLATION_ENGINE_REPOSITORY: ${{ vars.INFLATION_ENGINE_REPOSITORY }}
          INFLATION_ENGINE_DEPLOY_KEY: ${{ secrets.INFLATION_ENGINE_DEPLOY_KEY }}
        run: python email_smoke.py ${{ inputs.include_model_note && '--with-model-note' || '' }}
