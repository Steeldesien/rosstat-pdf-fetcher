name: Pre-release inflation forecast
run-name: 'Rosstat forecast ${{ inputs.forecast_id }}'
on:
  workflow_dispatch:
    inputs:
      forecast_id:
        description: Private coordinator ticket
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rosstat-forecast-${{ inputs.forecast_id }}
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Forecast coordination tests
        run: node --test forecast-jobs.test.mjs forecast-analysis.test.mjs report-files.test.mjs report-delivery.test.mjs scheduled-delivery.test.mjs
      - name: Rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Compute and preserve pre-release forecast
        env:
          FORECAST_ID: ${{ inputs.forecast_id }}
          REPORT_EMAIL_SMTP: ${{ vars.REPORT_EMAIL_ENABLED == 'true' && secrets.REPORT_EMAIL_SMTP || '' }}
          REPORT_EMAIL_RECIPIENTS: ${{ secrets.REPORT_EMAIL_RECIPIENTS }}
          REPORT_EMAIL_MODEL_NOTE_JOB: ${{ secrets.REPORT_EMAIL_MODEL_NOTE_JOB }}
          REPORT_EMAIL_MODEL_NOTE_1: ${{ inputs.forecast_id == secrets.REPORT_EMAIL_MODEL_NOTE_JOB && secrets.REPORT_EMAIL_MODEL_NOTE_1 || '' }}
          REPORT_EMAIL_MODEL_NOTE_2: ${{ inputs.forecast_id == secrets.REPORT_EMAIL_MODEL_NOTE_JOB && secrets.REPORT_EMAIL_MODEL_NOTE_2 || '' }}
          REPORT_EMAIL_MODEL_NOTE_3: ${{ inputs.forecast_id == secrets.REPORT_EMAIL_MODEL_NOTE_JOB && secrets.REPORT_EMAIL_MODEL_NOTE_3 || '' }}
          BROKER_URL: ${{ secrets.BROKER_URL }}
          BROKER_TOKEN: ${{ secrets.BROKER_TOKEN }}
          INFLATION_ENGINE_REPOSITORY: ${{ vars.INFLATION_ENGINE_REPOSITORY }}
          INFLATION_ENGINE_DEPLOY_KEY: ${{ secrets.INFLATION_ENGINE_DEPLOY_KEY }}
        run: python -u forecast_runner.py
