name: Download public Rosstat PDF
run-name: 'Rosstat PDF job ${{ inputs.job_id }}'
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Opaque delivery job identifier
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rosstat-job-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Downloader tests
        run: python -m unittest discover -v
      - name: Coordinator tests
        run: node --test coordinator.test.mjs analysis.test.mjs workers-ai.test.mjs workers-facts.test.mjs workers-weekly.test.mjs status-messages.test.mjs agy-auth.test.mjs engine-analysis.test.mjs report-files.test.mjs forecast-jobs.test.mjs forecast-analysis.test.mjs
      - name: Report rendering tools
        if: vars.INFLATION_ENGINE_REPOSITORY != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Download and relay PDF
        env:
          JOB_ID: ${{ inputs.job_id }}
          BROKER_URL: ${{ secrets.BROKER_URL }}
          BROKER_TOKEN: ${{ secrets.BROKER_TOKEN }}
          INFLATION_ENGINE_REPOSITORY: ${{ vars.INFLATION_ENGINE_REPOSITORY }}
          INFLATION_ENGINE_DEPLOY_KEY: ${{ secrets.INFLATION_ENGINE_DEPLOY_KEY }}
        run: python -u runner.py
      - name: Report unexpected workflow failure
        if: failure()
        env:
          JOB_ID: ${{ inputs.job_id }}
          BROKER_URL: ${{ secrets.BROKER_URL }}
          BROKER_TOKEN: ${{ secrets.BROKER_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.request
          job = os.environ['JOB_ID']
          owner = os.environ['GITHUB_RUN_ID'] + '-' + os.environ.get('GITHUB_RUN_ATTEMPT', '1')
          def call(operation, **extra):
              payload = json.dumps({'job_id':job,'run_id':owner,**extra}).encode()
              request = urllib.request.Request(os.environ['BROKER_URL'].rstrip('/')+'/runner/'+operation,
                  data=payload, headers={'Authorization':'Bearer '+os.environ['BROKER_TOKEN'],'Content-Type':'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          try:
              try:
                  call('progress',stage='error')
              except Exception:
                  if call('claim').get('status')=='ready':
                      call('progress',stage='error')
          except Exception:
              print('Private failure status unavailable; coordinator retains retry state.')
